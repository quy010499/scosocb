<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Cổng truy cập</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background:#020617;
    color:white;
    text-align:center;
}

.box{
    margin-top:120px;
}

button{
    padding:15px 30px;
    font-size:18px;
    background:#22c55e;
    border:none;
    border-radius:10px;
    color:white;
}
</style>
</head>

<body>

<div class="box">
<h1>🔒 CỔNG TRUY CẬP CHÍNH THỨC</h1>
<p>Nhấn để tiếp tục</p>

<button onclick="go()">TRUY CẬP NGAY</button>
</div>

<script>
function go(){
    if(!confirm("Bạn có muốn tiếp tục không?")) return;

    setTimeout(()=>{
        window.location.href="https://www.sc88a3.cc/?id=182346181";
    },1500);
}
</script>
